<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>测试React</title>
    <!-- 引入React和ReactDOM的CDN版本 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 简单的React组件
      function App() {
        return React.createElement('div', {
          style: {
            textAlign: 'center',
            marginTop: '100px'
          }
        }, [
          React.createElement('h1', null, '测试React'),
          React.createElement('p', null, '这是一个测试React的页面，用于验证React是否能正常加载。'),
          React.createElement('p', null, '如果您看到此页面，说明React和ReactDOM都已正确加载。'),
          React.createElement('p', null, '当前时间：', React.createElement('span', { id: 'time' }))
        ]);
      }

      // 渲染应用
      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(React.StrictMode, null, React.createElement(App))
      );

      // 更新时间
      document.getElementById('time').textContent = new Date().toLocaleString();
    </script>
  </body>
</html>
