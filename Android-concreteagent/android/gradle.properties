org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 项目路径含中文（"副本"），AGP 默认拒绝非 ASCII 路径，官方开关允许构建
android.overridePathCheck=true
# 关闭 Kotlin 增量编译：插件源码在 C:\ pub 缓存、项目在 D:\，跨盘符相对化报
# "this and base files have different roots"（Kotlin incremental caches 崩溃），
# 影响 image_picker_android / mobile_scanner / shared_preferences_android 等所有 Kotlin 插件模块
kotlin.incremental=false
