# CI（2026-08-23 第五批工程化引入；同日既有失败清零后测试门禁转严格）
# - lint / build / jest 三道全严格门禁（必须绿）
# - Windows runner：与开发环境一致（Electron + sqlite3 原生模块 + 路径分隔符行为）
# - jest 需 --experimental-vm-modules（pdf-parse v2 内部 dynamic import）
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（npm ci）
        run: npm ci

      - name: ESLint（error 必须为 0）
        run: npm run lint

      - name: 前端构建（vite build）
        run: npm run build

      - name: Jest 测试（严格门禁）
        run: npm test
