<h2>配色方案</h2>
<p class="subtitle">专业数据型风格下，选择配色倾向</p>

<div class="options">
  <div class="option" data-choice="blue" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>科技蓝</h3>
      <p>#1E56A0 深蓝主色 + #4A90D9 亮蓝点缀 + 灰白背景</p>
    </div>
  </div>

  <div class="option" data-choice="teal" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>沉稳青</h3>
      <p>#0D7377 青绿主色 + #14A3A8 亮青点缀 + 深灰背景</p>
    </div>
  </div>

  <div class="option" data-choice="indigo" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>靛蓝专业</h3>
      <p>#4338CA 靛蓝主色 + #6366F1 亮蓝点缀 + 冷灰背景</p>
    </div>
  </div>

  <div class="option" data-choice="slate" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>石墨灰</h3>
      <p>#334155 深灰蓝主色 + #64748B 中灰点缀 + 浅灰背景</p>
    </div>
  </div>
</div>

<h3 style="margin-top: 32px">当前系统的配色</h3>
<p class="subtitle">目前使用 #1E56A0 深蓝 + 白色背景，属于偏商务的科技蓝风格，升级方向可以在此基础上优化</p>
