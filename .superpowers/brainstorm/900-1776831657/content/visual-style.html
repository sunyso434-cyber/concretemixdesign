<h2>选择视觉风格</h2>
<p class="subtitle">导航轨布局确定后，选择整体视觉呈现风格</p>

<div class="options">
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简主义</h3>
      <p>大量留白，单色或双色，扁平无阴影，微妙的边界线区分内容</p>
    </div>
  </div>

  <div class="option" data-choice="modern" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>现代科技感</h3>
      <p>蓝灰色调，渐变点缀，卡片有轻阴影，分层更清晰，富有层次感</p>
    </div>
  </div>

  <div class="option" data-choice="warm" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>温暖商务</h3>
      <p>暖色调为主，圆角卡片，柔和阴影，给人专业而亲切的感觉</p>
    </div>
  </div>

  <div class="option" data-choice="professional" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>专业数据型</h3>
      <p>浅灰背景，深色文字，表格驱动，适合数据密集型后台系统</p>
    </div>
  </div>
</div>

<h3 style="margin-top: 32px">关于您的系统</h3>
<p class="subtitle">混凝土配合比设计系统包含：原材料、配合比、成本优化、温度场计算等功能，需要在视觉简洁的同时保证专业感和数据可读性</p>
